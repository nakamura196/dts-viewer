name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:export
      # フォーク等で github.io/<repo>/ 配下に置く場合の basePath 付きビルドも壊れていないか
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /dts-viewer
      - run: npm run test:export
        env:
          NEXT_PUBLIC_BASE_PATH: /dts-viewer
